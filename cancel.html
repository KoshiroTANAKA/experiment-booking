<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>実験予約のキャンセル</title>
  <style>
    body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f6f7fb;padding:20px;color:#253046}
    main{max-width:550px;margin:35px auto;padding:28px;background:white;border-radius:12px}
    button{background:#b42318;color:white;padding:13px 20px;border:0;border-radius:7px;font-size:16px;cursor:pointer}
    button:disabled{opacity:.5}.error{color:#b42318}.success{color:#127746}

    .busy{display:flex;align-items:center;gap:12px;margin:16px 0;padding:14px;background:#fff4ee;border-radius:9px;color:#753e24}
    .busy[hidden]{display:none}
    .spinner{width:22px;height:22px;flex:0 0 22px;border:3px solid #efd8cf;border-top-color:#b42318;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion: reduce){.spinner{animation:none;border-top-color:#b42318}}
    .busy-title{font-weight:700}.busy-note{font-size:13px;margin-top:4px;line-height:1.6}
  </style>
</head>
<body>
<main>
  <h1>実験予約のキャンセル</h1>
  <div id="loading" class="busy" role="status" aria-live="polite">
    <span class="spinner" aria-hidden="true"></span>
    <div><div class="busy-title">予約情報を確認しています…</div><div class="busy-note">時間がかかる場合があります。しばらくお待ちください。</div></div>
  </div>
  <div id="info"></div>
  <button id="cancel" hidden>この予約をキャンセルする</button>
  <div id="processing" class="busy" role="status" aria-live="polite" hidden>
    <span class="spinner" aria-hidden="true"></span>
    <div><div class="busy-title">キャンセルを処理しています…</div><div class="busy-note">処理完了まで時間がかかる場合があります。画面を閉じず、そのままお待ちください。</div></div>
  </div>
  <p id="message" role="status" aria-live="polite"></p>
</main>
<script>
// ★ここにGASのウェブアプリURL（.../exec）を貼り付けてください
const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwfqTbSEmmsA98wdzdjiOxMCtyWPOT-Uv7u8Psrl7_h-sz3IlE6oLJE_98UAP90Q6lHIw/exec';

const params = new URLSearchParams(window.location.search);
const token = params.get('cancel') || '';
const button = document.getElementById('cancel');
const info = document.getElementById('info');
const message = document.getElementById('message');
const loading = document.getElementById('loading');
const processing = document.getElementById('processing');

function fail(e){
  message.className='error';
  message.textContent=e&&e.message?e.message:String(e);
  button.disabled=false;
}

async function init() {
  if(!/^[a-f0-9]{64}$/.test(token)){
    loading.hidden=true;
    info.textContent='キャンセルURLが正しくありません。';
    return;
  }
  try {
    const res = await fetch(`${GAS_API_URL}?action=cancelLookup&token=${encodeURIComponent(token)}`);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    const d = json.data;
    info.textContent=`予約番号：${d.id} ／ ${d.date} ${d.start}～${d.end} ／ 状態：${d.status}。 ${d.message}`;
    button.hidden=!d.canCancel;
  } catch (err) {
    info.textContent='読み込みに失敗しました。';
    fail(err);
  } finally {
    loading.hidden=true;
  }
}

button.addEventListener('click', async () => {
  if(!confirm('この予約をキャンセルしますか？')) return;
  button.disabled=true;
  processing.hidden=false;
  message.textContent='';
  try {
    const res = await fetch(GAS_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'cancelBooking', token })
    });
    const result = await res.json();
    if (!result.ok) throw new Error(result.error);
    button.hidden=true;
    info.textContent='キャンセル済み';
    message.className='success';
    message.textContent=result.message+' メールも順次送信されます。';
  } catch (err) {
    fail(err);
    message.textContent += ' 通信が途中で切れた場合はキャンセル済みの可能性もあります。メールや予約状態を確認してから再操作してください。';
  } finally {
    processing.hidden=true;
  }
});

init();
</script>
</body>
</html>
